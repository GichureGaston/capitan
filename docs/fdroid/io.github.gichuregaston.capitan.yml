SourceCode: https://github.com/GichureGaston/capitan
IssueTracker: https://github.com/GichureGaston/capitan/issues

AutoName: Capitán

RepoType: git
Repo: https://github.com/GichureGaston/capitan.git

Builds:
  - versionName: 1.0.0
    versionCode: 1001
    commit: 027da4a17aa185b3a8c4b642f797166c81a141b0
    timeout: 7200
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.47.7
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter precache --android
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"

  - versionName: 1.0.0
    versionCode: 2001
    commit: 027da4a17aa185b3a8c4b642f797166c81a141b0
    timeout: 7200
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@3.47.7
    rm:
      - ios
      - linux
