Categories:
  - Sports & Health
  - Weather
License: Apache-2.0
AuthorName: Gaston Gichure
SourceCode: https://github.com/GichureGaston/capitan
IssueTracker: https://github.com/GichureGaston/capitan/issues

AutoName: Capitán

RepoType: git
Repo: https://github.com/GichureGaston/capitan.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 027da4a17aa185b3a8c4b642f797166c81a141b0
    timeout: 7200
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.7
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter precache --android
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

MaintainerNotes: |-
  Flutter 3.47.7 (Dart 3.13.5). Android builds use the vendored, GMS-free copy
  of geolocator_android in packages/geolocator_android (android.location
  LocationManager). Icons and store graphics are generated by
  tools/generate_icons.py from branding/app_icon_source.jpg.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1
