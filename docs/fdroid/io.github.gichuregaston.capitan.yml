      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-x64"

MaintainerNotes: |-
  Flutter 3.47.7 (Dart 3.13.5). Android builds use the vendored, GMS-free copy
  of geolocator_android in packages/geolocator_android (android.location
  LocationManager). Icons and store graphics are generated by
  tools/generate_icons.py from branding/app_icon_source.jpg.
  One build block per ABI: the universal APK is ~69 MB, split APKs are ~31-37 MB
  each. Flutter 3.47.7 generates ABI version codes as abi_code * 1000 + the
  pubspec version code (arm32=1, arm64=2, x86_64=4), which is why the build
  version codes are 1001/2001/4001 for version code 1.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
VercodeOperation:
  - 1000 + %c
  - 2000 + %c
  - 4000 + %c
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
