# Copy this file to metadata/io.github.gichuregaston.capitan.yml in a fork of
# https://gitlab.com/fdroid/fdroiddata and open a merge request.
#
# For the first build, replace the commit tag with the full commit hash
# (`git rev-parse v1.0.0`) so the build is pinned to an immutable revision.
#
# Flutter version: 3.47.7 (Dart 3.13.5).

Categories:
  - Sports & Health
  - Weather
License: Apache-2.0
AuthorName: Gaston Gichure
SourceCode: https://github.com/GichureGaston/capitan
IssueTracker: https://github.com/GichureGaston/capitan/issues
RepoType: git
Repo: https://github.com/GichureGaston/capitan.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    timeout: 7200
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.7
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter precache --android
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - .pub-cache
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 1.0.0
CurrentVersionCode: 1
