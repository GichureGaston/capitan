  - versionName: 1.0.0
    versionCode: 4001
    commit: 027da4a17aa185b3a8c4b642f797166c81a141b0
    timeout: 7200
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    srclibs:
      - flutter@3.47.7
    rm:
      - ios
      - linux
